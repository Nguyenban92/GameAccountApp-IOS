name: GameAccountApp
options:
  bundleIdPrefix: com.ban
targets:
  GameAccountApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [App]
    dependencies:
      - target: GameKeyboardExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.ban.GameAccountApp"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ứng dụng cần quyền truy cập ảnh để bạn chọn ảnh đại diện cho các tựa game."
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "garena-kgvn kgvn lienquanmobile garena vng-vltk volam freefire freefireth roblox igmobile riotgames genshinimpact shortcuts"

  GameKeyboardExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: KeyboardExtension
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: "Game Keyboard"
        CFBundleName: "GameKeyboardExtension"
        CFBundleExecutable: "GameKeyboardExtension"
        CFBundleIdentifier: "com.ban.GameAccountApp.GameKeyboardExtension"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.keyboard-service"
          NSExtensionPrincipalClass: "GameKeyboardExtension.KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: "vi-VN"
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.ban.GameAccountApp.GameKeyboardExtension"
        GENERATE_INFOPLIST_FILE: "NO"
