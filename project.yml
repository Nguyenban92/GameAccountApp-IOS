name: GameAccountApp
options:
  bundleIdPrefix: com.ban
targets:
  GameAccountApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [App]
    dependencies:
      - target: AutoFillExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.ban.GameAccountApp"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ứng dụng cần quyền truy cập ảnh để bạn chọn ảnh đại diện cho các tựa game."
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "garena-kgvn lienquanmobile garena vng-vltk volam freefire freefireth roblox igmobile riotgames genshinimpact shortcuts"
        # Bật App Groups cho App chính
        CODE_SIGN_ENTITLEMENTS: "App/GameAccountApp.entitlements"

  AutoFillExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Extension
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: AutoFillExtension
        CFBundleName: AutoFillExtension
        CFBundleExecutable: AutoFillExtension
        CFBundleIdentifier: com.ban.GameAccountApp.AutoFillExtension
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: AutoFillExtension.CredentialProviderViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.ban.GameAccountApp.AutoFillExtension"
        GENERATE_INFOPLIST_FILE: "NO"
        # Bật App Groups cho Extension
        CODE_SIGN_ENTITLEMENTS: "Extension/AutoFillExtension.entitlements"
